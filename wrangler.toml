name = "procedure"
compatibility_date = "2026-11-08"

# 1. バックエンドAPI（プログラム）の場所を明示
main = "./functions/api/matches.js"

# 2. フロントエンド（画面HTML）の場所を明示（エラーの原因を解消）
[assets]
directory = "./public"
run_worker_first = true

# 3. D1データベースのバインディング連携
[[d1_databases]]
binding = "DB"  # プログラム内の「DB」という名前に結びつけます
database_name = "procedure"  # あなたが作成したD1データベース名
database_id = "1ada25d7-8c4e-407f-b1dc-04272805786d"  # ※CloudflareのD1画面に表示されている英数字のID
